<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CadForge • 2D CAD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#d7e0ec;font:14px Segoe UI,Arial}header{height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;background:#1c2532;border-bottom:1px solid #354152}h1{font-size:21px;margin:0;color:#63d9c0}button,input,select{background:#273447;color:#e7eef8;border:1px solid #46556b;border-radius:5px;padding:8px;cursor:pointer}button:hover,button.active{background:#286f68}main{display:flex;height:calc(100vh - 112px)}aside{width:220px;padding:16px;background:#18212e;overflow:auto}aside button{width:100%;text-align:left;margin:3px 0}label{display:block;margin:13px 0 5px;font-size:12px;color:#a9bbce}canvas{width:100%;height:100%;display:block;touch-action:none}#viewport{flex:1;min-width:0;position:relative}#hint{position:absolute;top:14px;left:18px;color:#9fb2c7;pointer-events:none}footer{height:50px;display:flex;align-items:center;padding:8px 15px;gap:14px;border-top:1px solid #354152}#command{flex:1}#status{min-width:250px;font:12px Consolas}small{color:#9fb2c7;line-height:1.6}hr{border:0;border-top:1px solid #354152;margin:18px 0}
</style>
<header><h1>CadForge</h1><span>2D drafting workspace</span><button id="new">New</button><button id="save">Save project</button><button id="open">Open project / DXF</button><button id="dxf">Export DXF</button><button id="svg">Export SVG</button><input type="file" id="file" hidden accept=".json,.dxf"></header>
<main><aside><small>DRAW & EDIT</small><div id="tools"></div><hr><button id="undo">Undo · Ctrl+Z</button><button id="redo">Redo · Ctrl+Y</button><button id="fit">Fit drawing</button><label>Current layer</label><select id="layer"></select><button id="addLayer">Add layer</button><label>Layer color</label><input id="color" type="color" value="#63d9c0"><label><input id="visible" type="checkbox" checked> Layer visible</label><label><input id="snap" type="checkbox" checked> Grid / endpoint snap</label><label><input id="ortho" type="checkbox"> Orthogonal constraint</label><hr><small>Wheel: zoom<br>Middle / right drag: pan<br>Esc: cancel · Delete: erase<br>Coordinates: x,y in command bar<br>Drawing units are arbitrary.<br>Local autosave enabled.</small></aside><div id="viewport"><canvas id="canvas"></canvas><div id="hint"></div></div></main>
<footer><span>Command</span><input id="command" placeholder="LINE, CIRCLE, RECTANGLE, MOVE, COPY, DELETE, FIT — or x,y"><span id="status"></span></footer>
