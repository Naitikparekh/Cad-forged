[package]
name = "cadforge-render"
description = "CadForge scene renderer: turns a drawing into backend-independent draw operations, plus plot layout and PDF/SVG writers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cadforge-core = { path = "../cadforge-core" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"

[dev-dependencies]
approx = "0.5"
