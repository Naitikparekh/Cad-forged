[package]
name = "cadforge-app"
description = "CadForge desktop and web application (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cadforge"
path = "src/main.rs"

[dependencies]
cadforge-core = { path = "../cadforge-core" }
cadforge-render = { path = "../cadforge-render" }
cadforge-engine = { path = "../cadforge-engine" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
earcutr = "0.5"
base64 = "0.22"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Navigator", "Clipboard", "console"] }
js-sys = "0.3"
