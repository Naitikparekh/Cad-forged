<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CadForge</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; }
    canvas#cf_canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #adb6c0; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Loading CadForge…</div>
  <canvas id="cf_canvas"></canvas>
  <script type="module">
    import init, * as cf from './cadforge_app.js';
    window.cf = cf;
    try {
      await init();
      await cf.start('cf_canvas');
      document.getElementById('loading')?.remove();
    } catch (e) {
      document.getElementById('loading').textContent = 'Could not start CadForge: ' + e;
      console.error(e);
    }
  </script>
</body>
</html>
