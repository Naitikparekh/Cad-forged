<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CadForge</title>
<style>/* Design tokens. The dark palette follows AutoCAD's dark theme (model space #212830). */
:root {
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, "Liberation Mono", monospace;
  --canvas: #212830;
  --chrome: #1b1f24;
  --chrome-2: #23282e;
  --ribbon: #353b43;
  --ribbon-title: #2c3137;
  --raised: #3d444d;
  --sep: #48505a;
  --border: #3c434b;
  --text: #e9edf1;
  --text-2: #adb6c0;
  --text-3: #7f8a95;
  --accent: #2b8fe0;
  --accent-2: #5bb8ff;
  --accent-soft: #24496b;
  --hover: #464f5a;
  --press: #2d6396;
  --input: #14181c;
  --warn: #ffb454;
  --err: #ff7f74;
  --ok: #7ddc92;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55), 0 1px 0 rgba(255, 255, 255, .04) inset;
  --ic-l: #d9dfe6; --ic-k: #7f8b98; --ic-a: #55b5ff; --ic-o: #ffae42; --ic-g: #7bd88f;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --canvas: #ffffff;
  --chrome: #dfe3e8;
  --chrome-2: #eceff2;
  --ribbon: #f6f7f9;
  --ribbon-title: #e9ecf0;
  --raised: #ffffff;
  --sep: #c7cdd4;
  --border: #c3c9d0;
  --text: #1c2229;
  --text-2: #4c5864;
  --text-3: #76828e;
  --accent: #0b73c7;
  --accent-2: #0b73c7;
  --accent-soft: #cfe4f7;
  --hover: #dbe6f1;
  --press: #bcd6ee;
  --input: #ffffff;
  --warn: #b8660a;
  --err: #c43b2f;
  --ok: #1d8a3b;
  --shadow: 0 8px 24px rgba(30, 40, 50, .25);
  --ic-l: #3a4651; --ic-k: #8b97a3; --ic-a: #0b73c7; --ic-o: #d9741a; --ic-g: #1f9a4a;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 12px/1.3 var(--font); color: var(--text); background: var(--chrome); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; height: 100vh; min-width: 900px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; border: 2px solid transparent; }
::-webkit-scrollbar-track { background: transparent; }

/* icons */
.ico { display: block; flex: none; overflow: visible; }
.ico .l, .ico .a, .ico .o, .ico .g, .ico .k { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico .l { stroke: var(--ic-l); } .ico .a { stroke: var(--ic-a); } .ico .o { stroke: var(--ic-o); } .ico .g { stroke: var(--ic-g); } .ico .k { stroke: var(--ic-k); stroke-width: 1.4; }
.ico .fa { fill: var(--ic-a); stroke: none; } .ico .fo { fill: var(--ic-o); stroke: none; } .ico .fl { fill: var(--ic-l); stroke: none; } .ico .fk { fill: var(--ic-k); opacity: .25; stroke: none; }
.disabled .ico, .ico.dim { opacity: .38; }

/* ---------- title bar ---------- */
.titlebar { display: flex; align-items: center; height: 34px; background: var(--chrome); border-bottom: 1px solid var(--border); padding: 0 6px 0 4px; gap: 4px; flex: none; }
.app-btn { width: 34px; height: 30px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 4px; padding: 0; }
.app-btn:hover, .app-btn[aria-expanded="true"] { background: var(--hover); }
.qat { display: flex; align-items: center; gap: 1px; height: 100%; }
.qat-btn, .qat-arrow, .tb-btn { background: transparent; border: 0; border-radius: 3px; height: 26px; min-width: 26px; padding: 0 4px; display: grid; place-items: center; }
.qat-btn:hover, .qat-arrow:hover, .tb-btn:hover { background: var(--hover); }
.qat-btn.disabled { opacity: .4; pointer-events: none; }
.qat-arrow { min-width: 14px; width: 14px; padding: 0; }
.qat-sep { width: 1px; height: 18px; background: var(--sep); margin: 0 4px; }
.qat-ws { display: flex; align-items: center; gap: 4px; background: transparent; border: 0; color: var(--text-2); height: 26px; padding: 0 6px; border-radius: 3px; font-size: 12px; }
.qat-ws:hover { background: var(--hover); color: var(--text); }
.title-text { margin-left: 16px; color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-fill, .rtabs-fill, .dt-fill, .sb-fill, .lm-fill { flex: 1; }
.infocenter { position: relative; width: 270px; }
.ic-input { width: 100%; height: 24px; background: var(--input); border: 1px solid var(--border); border-radius: 3px; padding: 0 28px 0 8px; color: var(--text); outline: none; }
.ic-input:focus { border-color: var(--accent); }
.ic-icon { position: absolute; right: 8px; top: 5px; pointer-events: none; opacity: .7; }
.ic-results { position: absolute; z-index: 60; top: 28px; left: 0; width: 420px; max-height: 360px; overflow: auto; background: var(--chrome-2); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow); padding: 4px 0; }
.ic-head { padding: 4px 10px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.ic-hit { display: flex; width: 100%; align-items: center; gap: 8px; background: transparent; border: 0; text-align: left; padding: 5px 10px; }
.ic-hit:hover { background: var(--hover); }
.ic-name { font-weight: 600; white-space: nowrap; } .ic-desc { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- classic menu bar ---------- */
.menubar { display: flex; height: 24px; background: var(--chrome-2); border-bottom: 1px solid var(--border); flex: none; }
.mb { background: transparent; border: 0; padding: 0 12px; color: var(--text); }
.mb:hover, .mb.open { background: var(--hover); }

/* ---------- document tabs ---------- */
.doctabs { display: flex; align-items: flex-end; height: 28px; background: var(--chrome); padding: 0 4px; gap: 2px; border-bottom: 1px solid var(--border); flex: none; overflow: hidden; }
.dt { display: flex; align-items: center; gap: 8px; height: 25px; padding: 0 8px 0 12px; background: var(--chrome-2); border: 1px solid var(--border); border-bottom: 0; border-radius: 4px 4px 0 0; color: var(--text-2); cursor: pointer; min-width: 90px; max-width: 220px; }
.dt:hover { background: var(--ribbon-title); color: var(--text); }
.dt.active { background: var(--canvas); color: var(--text); height: 26px; position: relative; top: 1px; border-color: var(--border); }
.dt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-x { background: transparent; border: 0; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; color: inherit; padding: 0; opacity: .7; }
.dt-x:hover { background: var(--hover); opacity: 1; }
.dt.start, .dt.plus { min-width: 30px; padding: 0 9px; justify-content: center; }

/* ---------- workarea ---------- */
.workarea { flex: 1; display: flex; min-height: 0; position: relative; background: var(--canvas); }
.dock { display: flex; flex: none; position: relative; background: var(--chrome-2); border-right: 1px solid var(--border); width: 300px; }
.dock-right { border-right: 0; border-left: 1px solid var(--border); }
.viewport { flex: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); outline: none; }
.cv { position: absolute; left: 0; top: 0; display: block; }
.cv.over { cursor: none; touch-action: none; }
.layouttabs { display: flex; height: 24px; background: var(--chrome); border-top: 1px solid var(--border); flex: none; align-items: center; padding: 0 6px; gap: 2px; }
.layouttabs:empty { display: none; }

/* ---------- status bar ---------- */
.statusbar { display: flex; align-items: center; height: 30px; background: var(--chrome); border-top: 1px solid var(--border); padding: 0 6px; gap: 2px; flex: none; }
.sb-coords { min-width: 220px; height: 24px; background: transparent; border: 0; text-align: left; font: 12px var(--mono); color: var(--text-2); padding: 0 8px; border-radius: 3px; }
.sb-coords:hover { background: var(--hover); }
.sb-sep { width: 1px; height: 18px; background: var(--sep); margin: 0 4px; }
.sb-group { display: flex; align-items: center; gap: 1px; }
.sb-cell { display: flex; align-items: center; }
.sb { height: 24px; min-width: 28px; display: flex; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 0; border-radius: 3px; padding: 0 5px; color: var(--text-2); }
.sb:hover { background: var(--hover); }
.sb .ico .l { stroke: var(--ic-k); } .sb .ico .a { stroke: var(--ic-k); } .sb .ico .o { stroke: var(--ic-k); } .sb .ico .g { stroke: var(--ic-k); } .sb .ico .fa { fill: var(--ic-k); }
.sb.on { background: var(--accent-soft); color: var(--text); }
.sb.on .ico .l, .sb.on .ico .a { stroke: var(--accent-2); } .sb.on .ico .o { stroke: var(--accent-2); } .sb.on .ico .g { stroke: var(--accent-2); } .sb.on .ico .fa { fill: var(--accent-2); }
.sb-arrow { width: 12px; height: 24px; background: transparent; border: 0; padding: 0; display: grid; place-items: center; border-radius: 3px; color: var(--text-3); }
.sb-arrow:hover { background: var(--hover); color: var(--text); }
.sb-label { font-size: 11px; font-weight: 600; letter-spacing: .03em; }
.sb.text { padding: 0 8px; font-size: 12px; }
.sb.cust { width: 28px; }
.sb-text { white-space: nowrap; }
.app.clean .titlebar, .app.clean .doctabs, .clean .titlebar, .clean .ribbon-host, .clean .doctabs, .clean .menubar, .clean .dock, .clean .layouttabs, .clean .statusbar { display: none; }

.ribbon-host { background: var(--ribbon); border-bottom: 1px solid var(--border); flex: none; position: relative; }
.rtabs { display: flex; align-items: flex-end; height: 26px; padding: 0 6px; background: var(--chrome); gap: 1px; }
.rtab { height: 24px; padding: 0 14px; background: transparent; border: 0; color: var(--text-2); border-radius: 3px 3px 0 0; }
.rtab:hover { color: var(--text); background: var(--chrome-2); }
.rtab.active { background: var(--ribbon); color: var(--text); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
.rtab.contextual { color: #ffd37a; } .rtab.contextual.active { box-shadow: inset 0 2px 0 #f0a51a; }
.rmin { background: transparent; border: 0; width: 24px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: var(--text-2); }
.rmin:hover { background: var(--hover); }
.rbody { display: flex; align-items: stretch; height: 94px; padding: 3px 4px 0; overflow-x: auto; overflow-y: hidden; }
.ribbon-host[data-mode="1"] .rbody { display: none; }
.ribbon-host[data-mode="1"].flyout .rbody { display: flex; position: absolute; left: 0; right: 0; top: 26px; z-index: 40; background: var(--ribbon); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.ribbon-host[data-mode="2"] .rpanel-body { display: none; }
.ribbon-host[data-mode="2"] .rbody { height: 22px; }
.rsep { width: 1px; background: var(--sep); margin: 2px 3px 4px; flex: none; }
.rpanel { display: flex; flex-direction: column; justify-content: space-between; position: relative; flex: none; }
.rpanel-body { display: flex; align-items: stretch; gap: 2px; flex: 1; min-height: 0; padding: 0 2px; }
.rpanel-title { display: flex; align-items: center; justify-content: center; gap: 4px; height: 17px; color: var(--text-3); font-size: 11px; white-space: nowrap; user-select: none; position: relative; }
.rpanel-title.expandable { cursor: pointer; }
.rpanel-title.expandable:hover { color: var(--text); background: var(--ribbon-title); }
.rlaunch { position: absolute; right: 0; top: 2px; background: transparent; border: 0; padding: 0; width: 14px; height: 14px; display: grid; place-items: center; color: var(--text-3); }
.rlaunch:hover { color: var(--text); }
.rpanel.open .rpanel-title { background: var(--ribbon-title); color: var(--text); }
.rslideout { position: absolute; z-index: 30; left: 0; top: 100%; margin-top: 0; min-width: 100%; background: var(--ribbon); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 4px 6px; display: flex; flex-direction: column; gap: 1px; }

/* buttons */
.rb { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid transparent; border-radius: 3px; color: var(--text); padding: 0 6px; text-align: left; white-space: nowrap; }
.rb:hover { background: var(--hover); border-color: var(--sep); }
.rb:active, .rb.active { background: var(--press); border-color: var(--accent); }
.rb.large { flex-direction: column; justify-content: flex-start; gap: 2px; width: 52px; min-width: 52px; height: 72px; padding: 4px 2px 2px; text-align: center; }
.rb.large .rb-label { white-space: normal; line-height: 1.15; font-size: 11.5px; text-align: center; }
.rb.large .rb-caret { display: none; }
.rb.small { height: 23px; min-width: 24px; }
.rb.icon { width: 24px; height: 23px; padding: 0; justify-content: center; }
.rb-label { font-size: 12px; }
.rb.primary .ico .l { stroke: var(--ok); }
.rsplit { display: flex; align-items: stretch; }
.rsplit > .rb { border-top-right-radius: 0; border-bottom-right-radius: 0; flex: 1; }
.rsplit.large { flex-direction: column; align-items: stretch; width: 54px; }
.rsplit.large > .rb.large { border-radius: 3px 3px 0 0; height: 56px; width: 100%; }
.rb-arrow { width: 14px; background: transparent; border: 1px solid transparent; border-left: 0; border-radius: 0 3px 3px 0; color: var(--text-2); display: grid; place-items: center; padding: 0; }
.rb-arrow:hover { background: var(--hover); border-color: var(--sep); color: var(--text); }
.rsplit.large > .rb-arrow { width: 100%; height: 16px; border: 1px solid transparent; border-radius: 0 0 3px 3px; }
.rstack, .rcol { display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; }
.rrow { display: flex; gap: 0; }
.rstack .rb, .rstack .rsplit { width: 100%; }
.rfly { position: fixed; z-index: 230; background: var(--ribbon); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 4px 4px 0; display: flex; }
.rb.large.collapsed .rb-label { display: flex; flex-direction: column; align-items: center; }

/* combo boxes */
.rcombo { display: flex; align-items: center; gap: 6px; height: 23px; width: 190px; background: var(--input); border: 1px solid var(--border); border-radius: 3px; padding: 0 6px; color: var(--text); text-align: left; }
.rcombo:hover { border-color: var(--accent); }
.rcombo .ctext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcombo .ccaret { opacity: .7; }
.rcombo.visualstyle { width: 160px; }
.cstate { display: inline-flex; gap: 2px; align-items: center; }
.cswatch { display: inline-block; width: 12px; height: 12px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 2px; flex: none; vertical-align: -2px; }
:root[data-theme="light"] .cswatch { border-color: rgba(0, 0, 0, .35); }
.lwsample { display: inline-block; width: 34px; background: currentColor; vertical-align: middle; border-radius: 1px; }
.ltsample { color: var(--text); flex: none; }
.ltm svg { vertical-align: middle; }

/* hatch creation */
.patgrid { display: grid; grid-template-columns: repeat(7, 60px); gap: 3px; align-content: start; max-width: 470px; }
.pat { background: transparent; border: 1px solid var(--border); border-radius: 3px; padding: 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--text-2); }
.pat:hover { border-color: var(--accent); } .pat.sel { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); color: var(--text); }
.pat-thumb { width: 54px; height: 30px; border-radius: 2px; } .pat-name { font-size: 10px; }
.hprops { gap: 3px; } .hrow { display: flex; align-items: center; gap: 6px; font-size: 12px; } .hrow > span { width: 40px; color: var(--text-2); }
.hrow input { width: 70px; height: 21px; background: var(--input); border: 1px solid var(--border); border-radius: 3px; color: var(--text); padding: 0 4px; }
.hcolor { display: flex; gap: 6px; align-items: center; height: 21px; background: var(--input); border: 1px solid var(--border); border-radius: 3px; padding: 0 6px; width: 110px; }

/* viewport controls and navigation */
.vpctl { position: absolute; left: 8px; top: 6px; display: flex; gap: 0; z-index: 3; font-size: 12px; }
.vpctl button { background: transparent; border: 0; padding: 1px 3px; color: var(--text-2); border-radius: 3px; }
.vpctl button:hover { color: var(--text); background: rgba(127, 138, 149, .25); }
.viewcube { position: absolute; right: 14px; top: 10px; width: 118px; height: 138px; z-index: 3; }
.vc-canvas { display: block; touch-action: none; cursor: default; }
.vc-wcs { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); background: transparent; border: 0; color: var(--text-2); font-size: 11px; padding: 1px 6px; border-radius: 3px; }
.vc-wcs:hover { color: var(--text); background: rgba(127, 138, 149, .25); }
.navbar { position: absolute; right: 6px; top: 158px; display: flex; flex-direction: column; gap: 2px; z-index: 3; background: rgba(40, 46, 54, .72); border: 1px solid var(--border); border-radius: 4px; padding: 3px; backdrop-filter: blur(3px); }
:root[data-theme="light"] .navbar { background: rgba(255, 255, 255, .82); }
.nb, .nb-arrow { background: transparent; border: 0; border-radius: 3px; display: grid; place-items: center; width: 30px; height: 28px; padding: 0; }
.nb:hover, .nb-arrow:hover { background: var(--hover); }
.nb-split { display: flex; } .nb-split .nb { width: 24px; } .nb-arrow { width: 10px; color: var(--text-3); }

/* dynamic input */
.dyn { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.dyn-prompt { background: rgba(32, 38, 45, .94); border: 1px solid var(--sep); color: var(--text); padding: 3px 8px; border-radius: 2px; white-space: nowrap; max-width: 480px; overflow: hidden; text-overflow: ellipsis; }
.dyn-field { display: flex; align-items: center; gap: 6px; background: rgba(20, 24, 28, .94); border: 1px solid var(--accent); color: var(--text); padding: 3px 8px; border-radius: 2px; font-family: var(--mono); }
.dyn-k { color: var(--text-3); } .dyn-v { color: var(--accent-2); font-weight: 600; } .dyn-typed { color: #fff; }
.dyn-caret { display: inline-block; width: 1px; height: 14px; background: var(--accent-2); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
:root[data-theme="light"] .dyn-prompt { background: rgba(255, 255, 255, .95); } :root[data-theme="light"] .dyn-field { background: rgba(250, 252, 255, .96); } :root[data-theme="light"] .dyn-typed { color: #000; }

/* start page */
.startpage { position: absolute; inset: 0; background: var(--canvas); overflow: auto; z-index: 5; }
.start { display: flex; gap: 40px; padding: 28px 40px; max-width: 1180px; margin: 0 auto; }
.start-col { flex: 1; min-width: 0; } .start-col.side { max-width: 320px; flex: none; color: var(--text-2); }
.start h1 { font-size: 22px; font-weight: 300; margin: 0 0 18px; } .start h2 { font-size: 13px; font-weight: 600; margin: 26px 0 10px; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
.start-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; background: var(--chrome-2); border: 1px solid var(--border); border-radius: 4px; text-align: left; color: var(--text); min-height: 130px; }
.tile:hover { border-color: var(--accent); background: var(--ribbon); } .tile.primary { border-color: var(--accent); } .tile span { color: var(--text-3); font-size: 11.5px; } .tile svg { margin-bottom: 8px; } .tile b { font-size: 14px; font-weight: 600; }
.start-recent { display: flex; flex-direction: column; gap: 4px; } .rec { display: flex; align-items: center; gap: 12px; background: transparent; border: 1px solid transparent; padding: 8px 10px; border-radius: 4px; text-align: left; color: var(--text); }
.rec:hover { background: var(--chrome-2); border-color: var(--border); } .rec div { display: flex; flex-direction: column; } .rec span { color: var(--text-3); font-size: 11px; } .start-empty { color: var(--text-3); }
.start code, .help-text code { background: var(--input); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); } kbd { background: var(--raised); border: 1px solid var(--sep); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; font: 11px var(--mono); }
.start ul { padding-left: 18px; line-height: 1.7; }

/* in-place text editor */
.te { position: absolute; z-index: 6; background: var(--chrome-2); border: 1px solid var(--accent); box-shadow: var(--shadow); user-select: text; }
.te-bar { display: flex; align-items: center; gap: 8px; padding: 2px 6px; background: var(--ribbon); font-size: 11px; color: var(--text-2); white-space: nowrap; }
.te-title { font-weight: 600; color: var(--text); } .te-hint { flex: 1; color: var(--text-3); }
