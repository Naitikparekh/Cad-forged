<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CadForge • 2D CAD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#d7e0ec;font:14px Segoe UI,Arial}header{height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;background:#1c2532;border-bottom:1px solid #354152}h1{font-size:21px;margin:0;color:#63d9c0}button,input,select{background:#273447;color:#e7eef8;border:1px solid #46556b;border-radius:5px;padding:8px;cursor:pointer}button:hover,button.active{background:#286f68}main{display:flex;height:calc(100vh - 112px)}aside{width:220px;padding:16px;background:#18212e;overflow:auto}aside button{width:100%;text-align:left;margin:3px 0}label{display:block;margin:13px 0 5px;font-size:12px;color:#a9bbce}canvas{width:100%;height:100%;display:block;touch-action:none}#viewport{flex:1;min-width:0;position:relative}#hint{position:absolute;top:14px;left:18px;color:#9fb2c7;pointer-events:none}footer{height:50px;display:flex;align-items:center;padding:8px 15px;gap:14px;border-top:1px solid #354152}#command{flex:1}#status{min-width:250px;font:12px Consolas}small{color:#9fb2c7;line-height:1.6}hr{border:0;border-top:1px solid #354152;margin:18px 0}
</style>
<header><h1>CadForge</h1><span>2D drafting workspace</span><button id="new">New</button><button id="save">Save project</button><button id="open">Open project / DXF</button><button id="dxf">Export DXF</button><button id="svg">Export SVG</button><input type="file" id="file" hidden accept=".json,.dxf"></header>
<main><aside><small>DRAW & EDIT</small><div id="tools"></div><hr><button id="undo">Undo · Ctrl+Z</button><button id="redo">Redo · Ctrl+Y</button><button id="fit">Fit drawing</button><label>Current layer</label><select id="layer"></select><button id="addLayer">Add layer</button><label>Layer color</label><input id="color" type="color" value="#63d9c0"><label><input id="visible" type="checkbox" checked> Layer visible</label><label><input id="snap" type="checkbox" checked> Grid / endpoint snap</label><label><input id="ortho" type="checkbox"> Orthogonal constraint</label><hr><small>Wheel: zoom<br>Middle / right drag: pan<br>Esc: cancel · Delete: erase<br>Coordinates: x,y in command bar<br>Drawing units are arbitrary.<br>Local autosave enabled.</small></aside><div id="viewport"><canvas id="canvas"></canvas><div id="hint"></div></div></main>
<footer><span>Command</span><input id="command" placeholder="LINE, CIRCLE, RECTANGLE, MOVE, COPY, DELETE, FIT — or x,y"><span id="status"></span></footer>
<script data-module="core">
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let doc={layers:[{name:'0',color:'#63d9c0',visible:true}],entities:[]},history=[],future=[],tool='select',points=[],selected=-1,mouse={x:0,y:0},pan=null,view={x:0,y:0,scale:4},W=0,H=0;
const names={select:'Select',line:'Line',polyline:'Polyline',rectangle:'Rectangle',circle:'Circle',text:'Text',move:'Move',copy:'Copy',delete:'Erase'};
const layer=()=>doc.layers.find(l=>l.name===$('layer').value)||doc.layers[0], distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function notify(s){$('hint').textContent=s}function persist(){try{localStorage.setItem('cadforge',JSON.stringify(doc))}catch(e){notify('Autosave unavailable; use Save project.')}}
function checkpoint(){history.push(JSON.stringify(doc));if(history.length>100)history.shift();future=[]}
function mutate(fn){checkpoint();fn();persist();render()}
function syncLayers(){const old=$('layer').value;$('layer').replaceChildren(...doc.layers.map(l=>new Option(l.name,l.name)));if(doc.layers.some(l=>l.name===old))$('layer').value=old;$('color').value=layer().color;$('visible').checked=layer().visible}
function setTool(t){tool=t;points=[];document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));notify(t==='select'?'Select an entity.':t==='move'||t==='copy'?'Select an entity, then specify base and destination.':t==='polyline'?'Specify vertices; Enter finishes polyline.':`Specify ${names[t].toLowerCase()} points.`);render()}
for(const [t,n]of Object.entries(names)){const b=document.createElement('button');b.textContent=n;b.dataset.tool=t;b.onclick=()=>setTool(t);$('tools').append(b)}
function screen(p){return{x:W/2+(p.x-view.x)*view.scale,y:H/2-(p.y-view.y)*view.scale}}function world(p){return{x:view.x+(p.x-W/2)/view.scale,y:view.y-(p.y-H/2)/view.scale}}
function vertices(e){if(e.type==='circle')return[e.center];return e.points||[]}
function snap(p){if($('snap').checked){let best=null,d=10/view.scale;for(const e of doc.entities){if(!doc.layers.find(l=>l.name===e.layer)?.visible)continue;for(const q of vertices(e)){const n=distance(p,q);if(n<d){d=n;best=q}}}p=best?{...best}:{x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5}}if($('ortho').checked&&points.length){const a=points[points.length-1];if(Math.abs(p.x-a.x)>Math.abs(p.y-a.y))p.y=a.y;else p.x=a.x}return p}
function segmentDistance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return distance(p,{x:a.x+t*dx,y:a.y+t*dy})}
function hit(p){let idx=-1,best=9/view.scale;doc.entities.forEach((e,i)=>{if(!doc.layers.find(l=>l.name===e.layer)?.visible)return;let d=Infinity;if(e.type==='circle')d=Math.abs(distance(p,e.center)-e.radius);else if(e.type==='text')d=distance(p,e.points[0]);else{for(let j=1;j<e.points.length;j++)d=Math.min(d,segmentDistance(p,e.points[j-1],e.points[j]));if(e.closed)d=Math.min(d,segmentDistance(p,e.points.at(-1),e.points[0]))}if(d<best){best=d;idx=i}});return idx}
function drawEntity(e,color,dashed=false){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.5;ctx.setLineDash(dashed?[6,5]:[]);ctx.beginPath();if(e.type==='circle'){const p=screen(e.center);ctx.arc(p.x,p.y,e.radius*view.scale,0,Math.PI*2)}else if(e.type==='text'){const p=screen(e.points[0]);ctx.font=`${e.height*view.scale}px Segoe UI`;ctx.fillText(e.text,p.x,p.y)}else{e.points.forEach((p,i)=>{const q=screen(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(e.closed)ctx.closePath()}ctx.stroke();ctx.setLineDash([])}
function shape(t,a,b){if(t==='circle')return{type:'circle',center:a,radius:distance(a,b)};if(t==='rectangle')return{type:'polyline',points:[a,{x:b.x,y:a.y},b,{x:a.x,y:b.y}],closed:true};return{type:t==='polyline'?'polyline':'line',points:[a,b]}}
// Grid, construction preview and cursor are separate hooks so the workspace layer can restyle them.
function drawGrid(){let step=5;while(step*view.scale<22)step*=2;ctx.strokeStyle='#202c3a';ctx.lineWidth=1;const min=world({x:0,y:H}),max=world({x:W,y:0});ctx.beginPath();for(let x=Math.ceil(min.x/step)*step;x<max.x;x+=step){const p=screen({x,y:0});ctx.moveTo(p.x,0);ctx.lineTo(p.x,H)}for(let y=Math.ceil(min.y/step)*step;y<max.y;y+=step){const p=screen({x:0,y});ctx.moveTo(0,p.y);ctx.lineTo(W,p.y)}ctx.stroke();const o=screen({x:0,y:0});ctx.strokeStyle='#45546a';ctx.beginPath();ctx.moveTo(o.x,0);ctx.lineTo(o.x,H);ctx.moveTo(0,o.y);ctx.lineTo(W,o.y);ctx.stroke()}
function drawPreview(){if(points.length&&['line','rectangle','circle','polyline'].includes(tool)){const e=tool==='polyline'?{type:'polyline',points:[...points,mouse]}:shape(tool,points[0],mouse);drawEntity(e,'#ffffff',true)}}
function drawCursor(){const c=screen(mouse);ctx.strokeStyle='#b8cadb';ctx.beginPath();ctx.moveTo(c.x-9,c.y);ctx.lineTo(c.x+9,c.y);ctx.moveTo(c.x,c.y-9);ctx.lineTo(c.x,c.y+9);ctx.stroke()}
function render(){ctx.clearRect(0,0,W,H);drawGrid();doc.entities.forEach((e,i)=>{const l=doc.layers.find(l=>l.name===e.layer);if(l?.visible)drawEntity(e,i===selected?'#ffcb66':l.color)});drawPreview();drawCursor();$('status').textContent=`X ${mouse.x.toFixed(2)} Y ${mouse.y.toFixed(2)} | ${doc.entities.length} entities`}
function add(e){e.layer=layer().name;mutate(()=>doc.entities.push(e))}
async function accept(p){if(tool==='select'||tool==='delete'){selected=hit(p);if(tool==='delete'&&selected>=0){mutate(()=>doc.entities.splice(selected,1));selected=-1}render();return}if(tool==='move'||tool==='copy'){if(selected<0){selected=hit(p);render();return}points.push(p);if(points.length===2){const dx=p.x-points[0].x,dy=p.y-points[0].y;mutate(()=>{const e=tool==='copy'?structuredClone(doc.entities[selected]):doc.entities[selected];if(e.center){e.center.x+=dx;e.center.y+=dy}else e.points.forEach(q=>{q.x+=dx;q.y+=dy});if(tool==='copy')doc.entities.push(e)});points=[]}return}if(tool==='text'){const text=await cadPrompt('Text');if(text)add({type:'text',points:[p],text,height:5});return}points.push(p);if(tool!=='polyline'&&points.length===2){const e=shape(tool,points[0],p);if(distance(points[0],p)>1e-9)add(e);points=[]}render()}
function finish(){if(tool==='polyline'&&points.length>1)add({type:'polyline',points:[...points],closed:false});points=[];render()}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);if(e.button===1||e.button===2){pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};return}accept(mouse=snap(world({x:e.offsetX,y:e.offsetY})))};
canvas.onpointermove=e=>{if(pan){view.x=pan.vx-(e.clientX-pan.x)/view.scale;view.y=pan.vy+(e.clientY-pan.y)/view.scale}else mouse=snap(world({x:e.offsetX,y:e.offsetY}));render()};canvas.onpointerup=()=>pan=null;canvas.onpointercancel=()=>pan=null;canvas.oncontextmenu=e=>e.preventDefault();
canvas.onwheel=e=>{e.preventDefault();const p={x:e.offsetX,y:e.offsetY},a=world(p);view.scale=Math.max(.01,Math.min(1000,view.scale*Math.exp(-e.deltaY*.001)));const b=world(p);view.x+=a.x-b.x;view.y+=a.y-b.y;render()};
function fit(){const p=doc.entities.flatMap(e=>e.type==='circle'?[{x:e.center.x-e.radius,y:e.center.y-e.radius},{x:e.center.x+e.radius,y:e.center.y+e.radius}]:e.type==='text'?[e.points[0],{x:e.points[0].x+e.text.length*e.height*.6,y:e.points[0].y+e.height}]:vertices(e));if(!p.length){view={x:0,y:0,scale:4};render();return}const xs=p.map(q=>q.x),ys=p.map(q=>q.y),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);view={x:(a+b)/2,y:(c+d)/2,scale:Math.max(.01,Math.min(1000,Math.min(W/Math.max(20,b-a),H/Math.max(20,d-c))*.8))};render()}
function undo(redo=false){const from=redo?future:history,to=redo?history:future;if(!from.length)return;to.push(JSON.stringify(doc));doc=JSON.parse(from.pop());selected=-1;points=[];syncLayers();persist();render()}
$('undo').onclick=()=>undo();$('redo').onclick=()=>undo(true);$('fit').onclick=fit;
$('layer').onchange=()=>{syncLayers();render()};$('color').onchange=()=>mutate(()=>layer().color=$('color').value);$('visible').onchange=()=>mutate(()=>layer().visible=$('visible').checked);$('addLayer').onclick=async()=>{const name=await cadPrompt('Layer name');if(name&&!doc.layers.some(l=>l.name===name)){mutate(()=>doc.layers.push({name,color:'#63d9c0',visible:true}));syncLayers();$('layer').value=name;syncLayers()}};
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=()=>download('drawing.cadforge.json',JSON.stringify(doc,null,2),'application/json');$('new').onclick=async()=>{if((doc.entities.length||doc.solids?.length)&&!await cadConfirm('Clear drawing? Save first if needed.'))return;mutate(()=>doc={layers:[{name:'0',color:'#63d9c0',visible:true}],entities:[]});selected=-1;points=[];syncLayers();fit()};
function exportDXF(){const out=[],pair=(k,v)=>out.push(String(k),String(v));pair(0,'SECTION');pair(2,'HEADER');pair(9,'$ACADVER');pair(1,'AC1009');pair(0,'ENDSEC');pair(0,'SECTION');pair(2,'TABLES');pair(0,'TABLE');pair(2,'LAYER');pair(70,doc.layers.length);for(const l of doc.layers){pair(0,'LAYER');pair(2,l.name);pair(70,0);pair(62,l.visible?7:-7);pair(6,'CONTINUOUS')}pair(0,'ENDTAB');pair(0,'ENDSEC');pair(0,'SECTION');pair(2,'ENTITIES');for(const e of doc.entities){pair(0,e.type==='circle'?'CIRCLE':e.type==='text'?'TEXT':e.type==='line'?'LINE':'POLYLINE');pair(8,e.layer);if(e.type==='circle'){pair(10,e.center.x);pair(20,e.center.y);pair(30,0);pair(40,e.radius)}else if(e.type==='text'){pair(10,e.points[0].x);pair(20,e.points[0].y);pair(30,0);pair(40,e.height);pair(1,e.text)}else if(e.type==='line'){pair(10,e.points[0].x);pair(20,e.points[0].y);pair(30,0);pair(11,e.points[1].x);pair(21,e.points[1].y);pair(31,0)}else{pair(66,1);pair(70,e.closed?1:0);pair(10,0);pair(20,0);pair(30,0);for(const p of e.points){pair(0,'VERTEX');pair(8,e.layer);pair(10,p.x);pair(20,p.y);pair(30,0)}pair(0,'SEQEND');pair(8,e.layer)}}pair(0,'ENDSEC');pair(0,'EOF');return out.join('\r\n')+'\r\n'}
function importDXF(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/),records=[];let r=null;for(let i=0;i+1<lines.length;i+=2){const k=Number(lines[i].trim()),v=lines[i+1].trim();if(k===0){r={type:v,pairs:[]};records.push(r)}else if(r)r.pairs.push([k,v])}const result={layers:[{name:'0',color:'#63d9c0',visible:true}],entities:[]};let poly=null,section='',skipped=0;const val=(r,k,def=0)=>r.pairs.find(p=>p[0]===k)?.[1]??def,num=(r,k,def=0)=>Number(val(r,k,def)),pt=(r,k=10)=>({x:num(r,k),y:num(r,k+10)});for(const r of records){if(r.type==='SECTION'){section=val(r,2,'');continue}if(r.type==='ENDSEC'){section='';poly=null;continue}if(section==='TABLES'&&r.type==='LAYER'){const name=val(r,2,'0');const l={name,color:'#63d9c0',visible:num(r,62,7)>0};const i=result.layers.findIndex(x=>x.name===name);if(i>=0)result.layers[i]=l;else result.layers.push(l);continue}if(section!=='ENTITIES')continue;const name=String(val(r,8,'0'));if(!result.layers.some(l=>l.name===name))result.layers.push({name,color:'#63d9c0',visible:true});let e;if(r.type==='LINE')e={type:'line',points:[pt(r),pt(r,11)]};else if(r.type==='CIRCLE')e={type:'circle',center:pt(r),radius:num(r,40)};else if(r.type==='TEXT')e={type:'text',points:[pt(r)],text:String(val(r,1,'')),height:num(r,40,5)};else if(r.type==='POLYLINE'){e={type:'polyline',points:[],closed:!!(num(r,70)&1)};poly=e}else if(r.type==='VERTEX'&&poly){poly.points.push(pt(r));continue}else if(r.type==='SEQEND'){poly=null;continue}else if(r.type==='LWPOLYLINE'){const ps=[];for(const [k,v]of r.pairs){if(k===10)ps.push({x:Number(v),y:0});if(k===20&&ps.length)ps.at(-1).y=Number(v)}e={type:'polyline',points:ps,closed:!!(num(r,70)&1)};if(r.pairs.some(([k,v])=>k===42&&Number(v)!==0))skipped++}else{skipped++;continue}e.layer=name;result.entities.push(e)}result.entities=result.entities.filter(e=>e.type!=='polyline'||e.points.length>1);validate(result);return{doc:result,skipped}}
function validate(d){if(!d||!Array.isArray(d.layers)||!d.layers.length||!Array.isArray(d.entities))throw Error('Invalid project');const finite=p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y);for(const l of d.layers)if(typeof l.name!=='string'||!/^#[0-9a-f]{6}$/i.test(l.color)||typeof l.visible!=='boolean')throw Error('Invalid layer');for(const e of d.entities){if(!d.layers.some(l=>l.name===e.layer))throw Error('Missing layer');if(e.type==='circle'){if(!finite(e.center)||!Number.isFinite(e.radius)||e.radius<=0)throw Error('Invalid circle')}else if(!['line','polyline','text'].includes(e.type)||!Array.isArray(e.points)||!e.points.every(finite)||e.points.length<(e.type==='text'?1:2))throw Error('Invalid entity');if(e.type==='text'&&(typeof e.text!=='string'||!Number.isFinite(e.height)||e.height<=0))throw Error('Invalid text')}}
$('dxf').onclick=()=>download('drawing.dxf',exportDXF(),'application/dxf');$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text(),r=f.name.toLowerCase().endsWith('.dxf')?importDXF(text):{doc:JSON.parse(text),skipped:0};validate(r.doc);mutate(()=>doc=r.doc);selected=-1;points=[];syncLayers();fit();notify(r.skipped?`Imported with ${r.skipped} unsupported records or curved polylines; inspect geometry.`:'Drawing imported.')}catch(err){notify('Import failed: '+err.message)}e.target.value=''};
$('svg').onclick=()=>{const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const elements=doc.entities.filter(e=>doc.layers.find(l=>l.name===e.layer)?.visible).map(e=>{const color=doc.layers.find(l=>l.name===e.layer).color;if(e.type==='circle')return `<circle cx="${e.center.x}" cy="${-e.center.y}" r="${e.radius}" stroke="${color}" fill="none"/>`;if(e.type==='text')return `<text x="${e.points[0].x}" y="${-e.points[0].y}" font-size="${e.height}" fill="${color}">${esc(e.text)}</text>`;return `<${e.closed?'polygon':'polyline'} points="${e.points.map(p=>p.x+','+-p.y).join(' ')}" stroke="${color}" fill="none"/>`});download('drawing.svg',`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view.x-W/2/view.scale} ${-view.y-H/2/view.scale} ${W/view.scale} ${H/view.scale}" stroke-width="${1/view.scale}">${elements.join('')}</svg>`,'image/svg+xml')};
$('command').onkeydown=e=>{if(e.key!=='Enter')return;const s=e.target.value.trim().toLowerCase();e.target.value='';const m=s.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);if(m)accept({x:Number(m[1]),y:Number(m[2])});else if(s==='fit'||s==='zoom')fit();else if(s==='undo')undo();else if(s==='redo')undo(true);else if(s==='rectangle'||s==='rect')setTool('rectangle');else if(names[s])setTool(s);else if(s==='erase')setTool('delete');else if(!s)finish();else notify('Unknown command: '+s)};
document.onkeydown=e=>{if(e.target.matches('input,select'))return;if(e.key==='Escape'){points=[];selected=-1;setTool('select')}else if(e.key==='Enter')finish();else if(e.key==='Delete'&&selected>=0){mutate(()=>doc.entities.splice(selected,1));selected=-1;render()}else if(e.ctrlKey&&['z','y'].includes(e.key.toLowerCase())){e.preventDefault();undo(e.key.toLowerCase()==='y')}};
new ResizeObserver(()=>{const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);render()}).observe(canvas);
try{const saved=localStorage.getItem('cadforge');if(saved){const d=JSON.parse(saved);validate(d);doc=d}}catch(e){}syncLayers();setTool('select');




</script><script data-module="dialogs">'use strict';
// Accessible in-app dialogs work in browsers that disable window.prompt.
const dialogStyle=document.createElement('style');dialogStyle.textContent='dialog{background:#252d39;color:#e5edf7;border:1px solid #718096;border-radius:6px;width:390px;padding:24px;box-shadow:0 12px 60px #0008}dialog::backdrop{background:#0008}dialog input{width:100%;margin:14px 0}dialog .actions{display:flex;justify-content:flex-end;gap:8px}dialog h2{font-size:17px;margin:0 0 12px}';document.head.append(dialogStyle);
const inputDialog=document.createElement('dialog');inputDialog.innerHTML='<form method="dialog"><h2>CadForge</h2><label id="dialogLabel" for="dialogValue"></label><input id="dialogValue" autocomplete="off"><div class="actions"><button value="cancel" type="button" id="dialogCancel">Cancel</button><button value="ok" id="dialogOk">OK</button></div></form>';document.body.append(inputDialog);
let pendingDialog=null;
function cadPrompt(message,initial=''){return new Promise(resolve=>{if(pendingDialog)pendingDialog(null);pendingDialog=resolve;$('dialogLabel').textContent=message;$('dialogValue').value=initial;$('dialogValue').hidden=false;inputDialog.showModal();$('dialogValue').focus();$('dialogValue').select()})}
function cadConfirm(message){const result=cadPrompt(message);$('dialogValue').hidden=true;$('dialogOk').focus();return result.then(v=>v!==null)}
inputDialog.querySelector('form').onsubmit=e=>{e.preventDefault();const value=$('dialogValue').value;inputDialog.close();const resolve=pendingDialog;pendingDialog=null;resolve?.(value)};
$('dialogCancel').onclick=()=>{inputDialog.close();const resolve=pendingDialog;pendingDialog=null;resolve?.(null)};
inputDialog.oncancel=e=>{e.preventDefault();$('dialogCancel').click()};

</script><script id="cadforge-csg">// Constructive Solid Geometry (CSG) is a modeling technique that uses Boolean
// operations like union and intersection to combine 3D solids. This library
// implements CSG operations on meshes elegantly and concisely using BSP trees,
// and is meant to serve as an easily understandable implementation of the
// algorithm. All edge cases involving overlapping coplanar polygons in both
// solids are correctly handled.
// 
// Example usage:
// 
//     var cube = CSG.cube();
//     var sphere = CSG.sphere({ radius: 1.3 });
//     var polygons = cube.subtract(sphere).toPolygons();
// 
// ## Implementation Details
// 
// All CSG operations are implemented in terms of two functions, `clipTo()` and
// `invert()`, which remove parts of a BSP tree inside another BSP tree and swap
// solid and empty space, respectively. To find the union of `a` and `b`, we
// want to remove everything in `a` inside `b` and everything in `b` inside `a`,
// then combine polygons from `a` and `b` into one solid:
// 
//     a.clipTo(b);
//     b.clipTo(a);
//     a.build(b.allPolygons());
// 
// The only tricky part is handling overlapping coplanar polygons in both trees.
// The code above keeps both copies, but we need to keep them in one tree and
// remove them in the other tree. To remove them from `b` we can clip the
// inverse of `b` against `a`. The code for union now looks like this:
// 
//     a.clipTo(b);
//     b.clipTo(a);
//     b.invert();
//     b.clipTo(a);
//     b.invert();
//     a.build(b.allPolygons());
// 
// Subtraction and intersection naturally follow from set operations. If
// union is `A | B`, subtraction is `A - B = ~(~A | B)` and intersection is
// `A & B = ~(~A | ~B)` where `~` is the complement operator.
// 
// ## License
// 
// Copyright (c) 2011 Evan Wallace (http://madebyevan.com/), under the MIT license.

// # class CSG

// Holds a binary space partition tree representing a 3D solid. Two solids can
// be combined using the `union()`, `subtract()`, and `intersect()` methods.

CSG = function() {
  this.polygons = [];
};

// Construct a CSG solid from a list of `CSG.Polygon` instances.
CSG.fromPolygons = function(polygons) {
  var csg = new CSG();
  csg.polygons = polygons;
  return csg;
};

CSG.prototype = {
  clone: function() {
    var csg = new CSG();
    csg.polygons = this.polygons.map(function(p) { return p.clone(); });
    return csg;
  },

  toPolygons: function() {
    return this.polygons;
  },

  // Return a new CSG solid representing space in either this solid or in the
  // solid `csg`. Neither this solid nor the solid `csg` are modified.
  // 
  //     A.union(B)
  // 
  //     +-------+            +-------+
  //     |       |            |       |
  //     |   A   |            |       |
  //     |    +--+----+   =   |       +----+
  //     +----+--+    |       +----+       |
  //          |   B   |            |       |
  //          |       |            |       |
  //          +-------+            +-------+
  // 
  union: function(csg) {
    var a = new CSG.Node(this.clone().polygons);
    var b = new CSG.Node(csg.clone().polygons);
    a.clipTo(b);
    b.clipTo(a);
    b.invert();
    b.clipTo(a);
    b.invert();
    a.build(b.allPolygons());
    return CSG.fromPolygons(a.allPolygons());
  },

  // Return a new CSG solid representing space in this solid but not in the
  // solid `csg`. Neither this solid nor the solid `csg` are modified.
  // 
  //     A.subtract(B)
  // 
  //     +-------+            +-------+
  //     |       |            |       |
  //     |   A   |            |       |
  //     |    +--+----+   =   |    +--+
  //     +----+--+    |       +----+
  //          |   B   |
  //          |       |
  //          +-------+
  // 
  subtract: function(csg) {
    var a = new CSG.Node(this.clone().polygons);
    var b = new CSG.Node(csg.clone().polygons);
    a.invert();
    a.clipTo(b);
    b.clipTo(a);
    b.invert();
    b.clipTo(a);
    b.invert();
    a.build(b.allPolygons());
    a.invert();
    return CSG.fromPolygons(a.allPolygons());
  },

  // Return a new CSG solid representing space both this solid and in the
  // solid `csg`. Neither this solid nor the solid `csg` are modified.
  // 
  //     A.intersect(B)
  // 
  //     +-------+
  //     |       |
  //     |   A   |
  //     |    +--+----+   =   +--+
  //     +----+--+    |       +--+
  //          |   B   |
  //          |       |
  //          +-------+
  // 
  intersect: function(csg) {
    var a = new CSG.Node(this.clone().polygons);
    var b = new CSG.Node(csg.clone().polygons);
    a.invert();
    b.clipTo(a);
    b.invert();
    a.clipTo(b);
    b.clipTo(a);
    a.build(b.allPolygons());
    a.invert();
    return CSG.fromPolygons(a.allPolygons());
  },

  // Return a new CSG solid with solid and empty space switched. This solid is
  // not modified.
  inverse: function() {
    var csg = this.clone();
    csg.polygons.map(function(p) { p.flip(); });
    return csg;
  }
};

// Construct an axis-aligned solid cuboid. Optional parameters are `center` and
// `radius`, which default to `[0, 0, 0]` and `[1, 1, 1]`. The radius can be
// specified using a single number or a list of three numbers, one for each axis.
// 
// Example code:
// 
//     var cube = CSG.cube({
//       center: [0, 0, 0],
//       radius: 1
//     });
CSG.cube = function(options) {
  options = options || {};
  var c = new CSG.Vector(options.center || [0, 0, 0]);
  var r = !options.radius ? [1, 1, 1] : options.radius.length ?
           options.radius : [options.radius, options.radius, options.radius];
  return CSG.fromPolygons([
    [[0, 4, 6, 2], [-1, 0, 0]],
    [[1, 3, 7, 5], [+1, 0, 0]],
    [[0, 1, 5, 4], [0, -1, 0]],
    [[2, 6, 7, 3], [0, +1, 0]],
    [[0, 2, 3, 1], [0, 0, -1]],
    [[4, 5, 7, 6], [0, 0, +1]]
  ].map(function(info) {
    return new CSG.Polygon(info[0].map(function(i) {
      var pos = new CSG.Vector(
        c.x + r[0] * (2 * !!(i & 1) - 1),
        c.y + r[1] * (2 * !!(i & 2) - 1),
        c.z + r[2] * (2 * !!(i & 4) - 1)
      );
      return new CSG.Vertex(pos, new CSG.Vector(info[1]));
    }));
  }));
};

// Construct a solid sphere. Optional parameters are `center`, `radius`,
// `slices`, and `stacks`, which default to `[0, 0, 0]`, `1`, `16`, and `8`.
// The `slices` and `stacks` parameters control the tessellation along the
// longitude and latitude directions.
// 
// Example usage:
// 
//     var sphere = CSG.sphere({
//       center: [0, 0, 0],
//       radius: 1,
//       slices: 16,
//       stacks: 8
//     });
CSG.sphere = function(options) {
  options = options || {};
  var c = new CSG.Vector(options.center || [0, 0, 0]);
  var r = options.radius || 1;
  var slices = options.slices || 16;
  var stacks = options.stacks || 8;
  var polygons = [], vertices;
  function vertex(theta, phi) {
    theta *= Math.PI * 2;
    phi *= Math.PI;
    var dir = new CSG.Vector(
      Math.cos(theta) * Math.sin(phi),
      Math.cos(phi),
      Math.sin(theta) * Math.sin(phi)
    );
    vertices.push(new CSG.Vertex(c.plus(dir.times(r)), dir));
  }
  for (var i = 0; i < slices; i++) {
    for (var j = 0; j < stacks; j++) {
      vertices = [];
      vertex(i / slices, j / stacks);
      if (j > 0) vertex((i + 1) / slices, j / stacks);
      if (j < stacks - 1) vertex((i + 1) / slices, (j + 1) / stacks);
      vertex(i / slices, (j + 1) / stacks);
      polygons.push(new CSG.Polygon(vertices));
    }
  }
  return CSG.fromPolygons(polygons);
};

// Construct a solid cylinder. Optional parameters are `start`, `end`,
// `radius`, and `slices`, which default to `[0, -1, 0]`, `[0, 1, 0]`, `1`, and
// `16`. The `slices` parameter controls the tessellation.
// 
// Example usage:
// 
//     var cylinder = CSG.cylinder({
//       start: [0, -1, 0],
//       end: [0, 1, 0],
//       radius: 1,
//       slices: 16
//     });
CSG.cylinder = function(options) {
  options = options || {};
  var s = new CSG.Vector(options.start || [0, -1, 0]);
  var e = new CSG.Vector(options.end || [0, 1, 0]);
  var ray = e.minus(s);
  var r = options.radius || 1;
  var slices = options.slices || 16;
  var axisZ = ray.unit(), isY = (Math.abs(axisZ.y) > 0.5);
  var axisX = new CSG.Vector(isY, !isY, 0).cross(axisZ).unit();
  var axisY = axisX.cross(axisZ).unit();
  var start = new CSG.Vertex(s, axisZ.negated());
  var end = new CSG.Vertex(e, axisZ.unit());
  var polygons = [];
  function point(stack, slice, normalBlend) {
    var angle = slice * Math.PI * 2;
    var out = axisX.times(Math.cos(angle)).plus(axisY.times(Math.sin(angle)));
    var pos = s.plus(ray.times(stack)).plus(out.times(r));
    var normal = out.times(1 - Math.abs(normalBlend)).plus(axisZ.times(normalBlend));
    return new CSG.Vertex(pos, normal);
  }
  for (var i = 0; i < slices; i++) {
    var t0 = i / slices, t1 = (i + 1) / slices;
    polygons.push(new CSG.Polygon([start, point(0, t0, -1), point(0, t1, -1)]));
    polygons.push(new CSG.Polygon([point(0, t1, 0), point(0, t0, 0), point(1, t0, 0), point(1, t1, 0)]));
    polygons.push(new CSG.Polygon([end, point(1, t1, 1), point(1, t0, 1)]));
  }
  return CSG.fromPolygons(polygons);
};

// # class Vector

// Represents a 3D vector.
// 
// Example usage:
// 
//     new CSG.Vector(1, 2, 3);
//     new CSG.Vector([1, 2, 3]);
//     new CSG.Vector({ x: 1, y: 2, z: 3 });

CSG.Vector = function(x, y, z) {
  if (arguments.length == 3) {
    this.x = x;
    this.y = y;
    this.z = z;
  } else if ('x' in x) {
    this.x = x.x;
    this.y = x.y;
    this.z = x.z;
  } else {
    this.x = x[0];
    this.y = x[1];
    this.z = x[2];
  }
};

CSG.Vector.prototype = {
  clone: function() {
    return new CSG.Vector(this.x, this.y, this.z);
  },

  negated: function() {
    return new CSG.Vector(-this.x, -this.y, -this.z);
  },

  plus: function(a) {
    return new CSG.Vector(this.x + a.x, this.y + a.y, this.z + a.z);
  },

  minus: function(a) {
    return new CSG.Vector(this.x - a.x, this.y - a.y, this.z - a.z);
  },

  times: function(a) {
    return new CSG.Vector(this.x * a, this.y * a, this.z * a);
  },

  dividedBy: function(a) {
    return new CSG.Vector(this.x / a, this.y / a, this.z / a);
  },

  dot: function(a) {
    return this.x * a.x + this.y * a.y + this.z * a.z;
  },

  lerp: function(a, t) {
    return this.plus(a.minus(this).times(t));
  },

  length: function() {
    return Math.sqrt(this.dot(this));
  },

  unit: function() {
    return this.dividedBy(this.length());
  },

  cross: function(a) {
    return new CSG.Vector(
      this.y * a.z - this.z * a.y,
      this.z * a.x - this.x * a.z,
      this.x * a.y - this.y * a.x
    );
  }
};

// # class Vertex

// Represents a vertex of a polygon. Use your own vertex class instead of this
// one to provide additional features like texture coordinates and vertex
// colors. Custom vertex classes need to provide a `pos` property and `clone()`,
// `flip()`, and `interpolate()` methods that behave analogous to the ones
// defined by `CSG.Vertex`. This class provides `normal` so convenience
// functions like `CSG.sphere()` can return a smooth vertex normal, but `normal`
// is not used anywhere else.

CSG.Vertex = function(pos, normal) {
  this.pos = new CSG.Vector(pos);
  this.normal = new CSG.Vector(normal);
};

CSG.Vertex.prototype = {
  clone: function() {
    return new CSG.Vertex(this.pos.clone(), this.normal.clone());
  },

  // Invert all orientation-specific data (e.g. vertex normal). Called when the
  // orientation of a polygon is flipped.
  flip: function() {
    this.normal = this.normal.negated();
  },

  // Create a new vertex between this vertex and `other` by linearly
  // interpolating all properties using a parameter of `t`. Subclasses should
  // override this to interpolate additional properties.
  interpolate: function(other, t) {
    return new CSG.Vertex(
      this.pos.lerp(other.pos, t),
      this.normal.lerp(other.normal, t)
    );
  }
};

// # class Plane

// Represents a plane in 3D space.

CSG.Plane = function(normal, w) {
  this.normal = normal;
  this.w = w;
};

// `CSG.Plane.EPSILON` is the tolerance used by `splitPolygon()` to decide if a
// point is on the plane.
CSG.Plane.EPSILON = 1e-5;

CSG.Plane.fromPoints = function(a, b, c) {
  var n = b.minus(a).cross(c.minus(a)).unit();
  return new CSG.Plane(n, n.dot(a));
};

CSG.Plane.prototype = {
  clone: function() {
    return new CSG.Plane(this.normal.clone(), this.w);
  },

  flip: function() {
    this.normal = this.normal.negated();
    this.w = -this.w;
  },

  // Split `polygon` by this plane if needed, then put the polygon or polygon
  // fragments in the appropriate lists. Coplanar polygons go into either
  // `coplanarFront` or `coplanarBack` depending on their orientation with
  // respect to this plane. Polygons in front or in back of this plane go into
  // either `front` or `back`.
  splitPolygon: function(polygon, coplanarFront, coplanarBack, front, back) {
    var COPLANAR = 0;
    var FRONT = 1;
    var BACK = 2;
    var SPANNING = 3;

    // Classify each point as well as the entire polygon into one of the above
    // four classes.
    var polygonType = 0;
    var types = [];
    for (var i = 0; i < polygon.vertices.length; i++) {
      var t = this.normal.dot(polygon.vertices[i].pos) - this.w;
      var type = (t < -CSG.Plane.EPSILON) ? BACK : (t > CSG.Plane.EPSILON) ? FRONT : COPLANAR;
      polygonType |= type;
      types.push(type);
    }

    // Put the polygon in the correct list, splitting it when necessary.
    switch (polygonType) {
      case COPLANAR:
        (this.normal.dot(polygon.plane.normal) > 0 ? coplanarFront : coplanarBack).push(polygon);
        break;
      case FRONT:
        front.push(polygon);
        break;
      case BACK:
        back.push(polygon);
        break;
      case SPANNING:
        var f = [], b = [];
        for (var i = 0; i < polygon.vertices.length; i++) {
          var j = (i + 1) % polygon.vertices.length;
          var ti = types[i], tj = types[j];
          var vi = polygon.vertices[i], vj = polygon.vertices[j];
          if (ti != BACK) f.push(vi);
          if (ti != FRONT) b.push(ti != BACK ? vi.clone() : vi);
          if ((ti | tj) == SPANNING) {
            var t = (this.w - this.normal.dot(vi.pos)) / this.normal.dot(vj.pos.minus(vi.pos));
            var v = vi.interpolate(vj, t);
            f.push(v);
            b.push(v.clone());
          }
        }
        if (f.length >= 3) front.push(new CSG.Polygon(f, polygon.shared));
        if (b.length >= 3) back.push(new CSG.Polygon(b, polygon.shared));
        break;
    }
  }
};

// # class Polygon

// Represents a convex polygon. The vertices used to initialize a polygon must
// be coplanar and form a convex loop. They do not have to be `CSG.Vertex`
// instances but they must behave similarly (duck typing can be used for
// customization).
// 
// Each convex polygon has a `shared` property, which is shared between all
// polygons that are clones of each other or were split from the same polygon.
// This can be used to define per-polygon properties (such as surface color).

CSG.Polygon = function(vertices, shared) {
  this.vertices = vertices;
  this.shared = shared;
  this.plane = CSG.Plane.fromPoints(vertices[0].pos, vertices[1].pos, vertices[2].pos);
};

CSG.Polygon.prototype = {
  clone: function() {
    var vertices = this.vertices.map(function(v) { return v.clone(); });
    return new CSG.Polygon(vertices, this.shared);
  },

  flip: function() {
    this.vertices.reverse().map(function(v) { v.flip(); });
    this.plane.flip();
  }
};

// # class Node

// Holds a node in a BSP tree. A BSP tree is built from a collection of polygons
// by picking a polygon to split along. That polygon (and all other coplanar
// polygons) are added directly to that node and the other polygons are added to
// the front and/or back subtrees. This is not a leafy BSP tree since there is
// no distinction between internal and leaf nodes.

CSG.Node = function(polygons) {
  this.plane = null;

 if(t==='line'&&points.length){const o=pickOpt(S.chain.pts.length>=3?['Close','Undo']:['Undo']);if(o==='Undo')return lineUndo;if(o==='Close')return lineClose}
 if(t==='polyline'&&points.length){const o=pickOpt(['Close','Undo']);if(o==='Undo')return plineUndo;if(o==='Close')return plineClose}
 if(t==='circle'&&points.length===1&&pickOpt(['Diameter']))return circleDiameter;
 if(t==='copy'&&points.length){const o=pickOpt(['Exit','Undo']);if(o==='Undo')return copyUndo;if(o==='Exit')return()=>endCmd(true)}
 if(t==='rectangle'&&points.length===1&&pickOpt(['Dimensions']))return rectDims;
 return null}
function answerTool(text){
 const echo=CF.prompt();
 if(text===''){CF.enter();return}
 const opt=toolOption(text);
 if(opt){print(`${echo} ${text}`);return opt()}
 if(tool==='circle'&&points.length===1&&RE.num.test(text)){
  print(`${echo} ${text}`);const r=+text;if(!(r>0)){notify('Requires a positive, nonzero radius.');return}
  add({type:'circle',center:{...points[0]},radius:r});S.lastRadius=r;endCmd();return}
 const base=points.length?points[points.length-1]:null,p=parsePointText(text,base,mouse);
 if(p){print(`${echo} ${text}`);S.typed=true;try{return accept(p)}finally{S.typed=false}}
 print(`${echo} ${text}`);
 const def=CF.resolve(text);
 if(def&&def.name===text.trim().toUpperCase().replace(/^[_.'-]+/,'')){CF.run(text,{source:'command'});return}
 notify('Point or option keyword required.')}
const LEGACY=new Set(['fit','obj','stl','movemesh','copymesh','joinprofile','restorelayout','rect','select','close']);
const prevCmdKey=input.onkeydown;
function answerIdle(text){
 if(text===''){repeatLast();return}
 print(`Command: ${text}`);
 if(!CF.resolve(text)){
  if(LEGACY.has(text.toLowerCase())&&prevCmdKey){input.value=text;try{prevCmdKey.call(input,{key:'Enter',target:input,preventDefault(){},stopPropagation(){}})}catch(err){notify(String(err?.message||err))}return}
  print(`Unknown command "${text.toUpperCase()}".  Press F1 for help.`);return}
 CF.run(text,{source:'command'})}
function repeatLast(){const n=CF.lastCommand;if(!n){print('Command:');return}print(`Command: ${n}`);CF.run(n,{source:'repeat'})}
function submit(text){
 const raw=String(text??''),t=raw.trim();
 if(t)remember(t);S.recall=-1;
 try{
  let r;
  if(CF.input)answerInput(raw);else if(CF.picking)answerPicking(t);
  else if(t&&tool!=='select'&&CF.drafting&&CF.drafting.state&&CF.drafting.state()&&CF.drafting.state().prompt!=null&&CF.drafting.input){const echo=CF.prompt();r=CF.drafting.input(t);if(r)print(`${echo} ${t}`);else r=answerTool(t)} // option keyword for a drafting command (clickable options, macros)
  else if(tool!=='select'||points.length)r=answerTool(t);else answerIdle(t);
  if(r&&typeof r.then==='function')r.catch(err=>notify(`Command failed: ${err?.message||err}`))}
 catch(err){notify(`Command failed: ${err?.message||err}`)}
 syncPrompt();return new Promise(res=>setTimeout(()=>{syncPrompt();res()},0))}
// ---- CF.enter / CF.cancel / CF.prompt -------------------------------------------------------------------------------
CF.prompt=function(){
 if(CF.input)return CF.input.message;
 if(CF.picking)return CF.picking.message||'Select objects:';
 const p=CF.prompts[tool];if(p){const s=typeof p==='function'?p():p;if(s)return s}
 const e=ENGINE_PROMPTS[tool];if(e)return`${labelFor(tool)} ${e()}`;
 return tool==='select'?'Command:':labelFor(tool)};
CF.enter=function(){
 if(CF.input){answerInput('');return}
 if(CF.picking){const pk=CF.picking;print(pk.message);pk.done();syncPrompt();render();return}
 if(tool==='select'&&!points.length){repeatLast();return}
 print(CF.prompt());const t=tool;
 if(t==='polyline')finish();
 else if(t==='circle'&&points.length===1&&S.lastRadius>0)add({type:'circle',center:{...points[0]},radius:S.lastRadius});
 endCmd(t==='copy'&&S.copy.count>0)};
CF.cancel=function(){
 const busy=!!(CF.input||CF.picking||tool!=='select'||points.length),wasPicking=!!CF.picking;
 input.value='';hideAc();S.recall=-1;abortPending();S.active=null;S.zoom.p1=null;
 if(tool!=='select')setTool('select');else points=[];
 print('*Cancel*');
 if(!busy||wasPicking){selectionSet.clear();selected=-1;CF.emit('selection',[])}
 syncPrompt();render()};
// ---- ZOOM with a view stack ---------------------------------------------------------------------------------------
const snapView=()=>({x:view.x,y:view.y,scale:view.scale}),clampScale=s=>Math.max(.01,Math.min(1000,s));
function pushView(v){S.views.push(v);if(S.views.length>30)S.views.shift()}
function commitView(fn){const b=snapView();S.lock++;try{fn()}finally{S.lock--}const a=snapView();if(Math.abs(a.x-b.x)>1e-9||Math.abs(a.y-b.y)>1e-9||Math.abs(a.scale-b.scale)>1e-9)pushView(b);S.lastView=snapView();S.viewAt=0}
function noteView(){
 if(mode3D||!view||S.lock)return;const c=snapView(),l=S.lastView;if(!l){S.lastView=c;return}
 if(Math.abs(c.x-l.x)<1e-9&&Math.abs(c.y-l.y)<1e-9&&Math.abs(c.scale-l.scale)<1e-9)return;
 const now=Date.now();if(now-S.viewAt>700)pushView(l);S.viewAt=now;S.lastView=c}
function extentsView(){
 const bs=doc.entities.map(e=>G.bbox(e));if(!bs.length)return{x:0,y:0,scale:4};
 const a=Math.min(...bs.map(b=>b.minX)),b=Math.max(...bs.map(b=>b.maxX)),c=Math.min(...bs.map(b=>b.minY)),d=Math.max(...bs.map(b=>b.maxY));
 return{x:(a+b)/2,y:(c+d)/2,scale:clampScale(Math.min(W/Math.max(20,b-a),H/Math.max(20,d-c))*.8)}}
function zoomTo(v){commitView(()=>{view={x:v.x,y:v.y,scale:clampScale(v.scale)};render()})}
function zoomWindow(a,b){
 const dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
 if(dx<1e-9||dy<1e-9){notify('Invalid window; the corners must differ in both directions.');return}
 if(mode3D){notify('Zoom Window works in the 2D model view.');return}
 zoomTo({x:(a.x+b.x)/2,y:(a.y+b.y)/2,scale:Math.min(W/dx,H/dy)})}
function zoomScale(f){if(mode3D){camera3.scale=Math.max(.01,Math.min(1000,camera3.scale*f));render();return}zoomTo({x:view.x,y:view.y,scale:view.scale*f})}
async function zoomCorner(label){const raw=await askLine({message:label,kind:'point'});return raw===null?null:parsePointText(raw,S.lastPoint,null)}
async function zoomAnswer(raw){
 const t=raw.trim(),opt=matchOpt(t,['All','Extents','Previous','Window','In','Out']);let m;
 if(opt==='All'||opt==='Extents'){if(mode3D)fit();else commitView(()=>fit());return true}
 if(opt==='Previous'){const v=S.views.pop();if(!v)notify('No previous view saved.');else{view=v;S.lastView=snapView();S.viewAt=0;render()}return true}
 if(opt==='In'){zoomScale(2);return true}if(opt==='Out'){zoomScale(.5);return true}
 if(opt==='Window'){const a=await zoomCorner('ZOOM Specify first corner:');if(!a)return true;S.zoom.p1=a;points=[a];const b=await zoomCorner('ZOOM Specify opposite corner:');if(b)zoomWindow(a,b);return true}
 if(m=t.match(RE.zoomNum)){const n=+m[1];if(!(n>0)){notify('Requires a positive scale factor.');return false}
  if(mode3D)zoomScale(n);else if(m[2])zoomScale(n);else{const e=extentsView();zoomTo({x:view.x,y:view.y,scale:e.scale*n})}return true}
 const a=parsePointText(t,S.lastPoint,null);
 if(a){S.zoom.p1=a;points=[a];const b=await zoomCorner('ZOOM Specify opposite corner:');if(b)zoomWindow(a,b);return true}
 notify('Requires a point, a scale factor or an option keyword.');return false}
async function zoomCmd(arg){
 abortPending();S.active='ZOOM';setTool('zoom');S.hold++;const message=ENGINE_PROMPTS.zoom();
 try{
  let first=typeof arg==='string'?arg:null;
  for(;;){
   let raw=first;first=null;
   if(raw===null||raw===undefined){raw=await askLine({message:`ZOOM ${message}`,def:'Extents',kind:'point'});if(raw===null)return}
   else print(`ZOOM ${message} ${raw}`);
   if(await zoomAnswer(raw))return}}
 finally{S.hold--;S.zoom.p1=null;if(tool==='zoom')endCmd()}}
CF.previews.zoom=m=>{const a=S.zoom.p1;return a?[{type:'polyline',closed:true,points:[a,{x:m.x,y:a.y},m,{x:a.x,y:m.y}]}]:[]};

function copyClip(cut){
 const ids=chosen();if(!ids.length){notify('Select objects first.');return}
 const items=ids.map(i=>structuredClone(doc.entities[i])),bs=items.map(e=>G.bbox(e));
 S.clip={items,base:{x:Math.min(...bs.map(b=>b.minX)),y:Math.min(...bs.map(b=>b.minY))}};
 print(`${items.length} object${items.length===1?'':'s'} copied to the clipboard.`);if(cut)eraseIds(ids)}
function pasteAt(p){
 if(!S.clip)return;const dx=p.x-S.clip.base.x,dy=p.y-S.clip.base.y,groups={},start=doc.entities.length;
 const ents=S.clip.items.map(e=>{const c=structuredClone(e);delete c.uuid;transformEntity(c,q=>({x:q.x+dx,y:q.y+dy}));if(c.group)c.group=groups[c.group]??=gid();if(!doc.layers.some(l=>l.name===c.layer))c.layer=layer().name;return c});
 mutate(()=>doc.entities.push(...ents));CF.select(ents.map((_,k)=>start+k),'replace');endCmd()}
CF.previews.paste=m=>{
 if(!S.clip)return[];const dx=m.x-S.clip.base.x,dy=m.y-S.clip.base.y;
 return S.clip.items.slice(0,500).map(e=>{const c=structuredClone(e);transformEntity(c,q=>({x:q.x+dx,y:q.y+dy}));return c})};

function helpCmd(){
 const cats=['Draw','Modify','Block','Utilities','View','Settings','Files','3D','Help'],by={};
 for(const d of CF.commands.values())(by[d.category||'Other']??=[]).push(d);
 print('CadForge commands: type a name or alias at the Command prompt, then press Enter or Space.');
 for(const c of [...cats,...Object.keys(by).filter(c=>!cats.includes(c))])if(by[c])print(`${c}: `+by[c].sort((a,b)=>a.name<b.name?-1:1).map(d=>d.aliases.length?`${d.name} (${d.aliases.slice(0,2).join(', ')})`:d.name).join(', '));

function askChoice(label,message,options,def,apply,arg){

  let raw=typeof arg==='string'?arg:null;

function undoKey(redo,quiet){
 if(!redo&&CF.input)return;
 if(!redo&&tool==='line'&&S.chain.pts.length>1){lineUndo();return}

function dialogOpen(){

  if(typeof inputDialog!=='undefined'&&inputDialog.open)return true;if(typeof plotDialog!=='undefined'&&plotDialog.open)return true;
  if(typeof exportDialog!=='undefined'&&exportDialog.open)return true;if(typeof extrusionDialog!=='undefined'&&extrusionDialog.open)return true;

// Every item of a model, flattened (splits, columns, rows and panel slide-outs included).
function shellItems(model){const out=[],walk=it=>{if(!it)return;if(it.items)it.items.forEach(walk);if(it.kind==='button')out.push(it)};for(const t of model)for(const p of t.panels){p.items.forEach(walk);(p.more||[]).forEach(walk)}return out}
const shellCommandNames=ws=>[...new Set(shellItems(shellRibbonModel(ws)).map(i=>i.cmd).filter(Boolean))];

// ---- Execution ------------------------------------------------------------------------------------------------
function shellItemActive(it){try{if(it.isActive)return !!it.isActive();if(it.flag)return CF.get(it.flag);if(!it.cmd)return false;const t=TOOLS[it.cmd]||it.cmd.toLowerCase();return (tool!=='select'&&tool===t)||String(CF.picking?.command||'').toUpperCase()===it.cmd}catch{return false}}
function shellRecent(name){if(!name)return;sh.recent=[name,...sh.recent.filter(n=>n!==name)].slice(0,8)}
// Ribbon macros pass an option keyword (ZOOM -> E). CF.run receives it as args; if the command still waits at an
// option prompt that offers it, the keyword is submitted through the command line like a typed response.
function shellFollow(opt){setTimeout(()=>{try{const i=CF.input,m=String(i?.message||'').match(/\[([^\]]*)\]/);if(i&&m&&CF.commandLine?.submit&&m[1].split('/').some(o=>o.trim().toUpperCase().startsWith(opt[0].toUpperCase())))CF.commandLine.submit(opt)}catch{}},0)}
function shellExec(it,entry,index){
 if(entry&&index!=null){sh.split[entry.id]=index;entry.render()}
 closeMenus();hideTip();
 if(sh.start&&!['OPEN','DXFIN'].includes(it.cmd))showStart(false);
 try{let r;
  if(it.flag)r=CF.toggle(it.flag);
  else if(it.run)r=it.run(it);
  else if(it.cmd){if(CF.resolve(it.cmd)){CF.run(it.cmd,{source:'ribbon',args:it.opt});if(it.opt)shellFollow(it.opt)}
   else{const fb=typeof it.fallback==='function'?it.fallback:FALLBACK[it.cmd];if(fb){shellRecent(it.cmd);r=fb(it)}else CF.run(it.cmd,{source:'ribbon'})}}
  if(r&&typeof r.then==='function')r.catch(err=>shellNotify(`${it.cmd||plain(it.label)} failed: ${err?.message||err}`));
 }catch(err){shellNotify(`${it.cmd||plain(it.label)} failed: ${err?.message||err}`)}

}

 CF.on('workspace',ws=>{buildRibbon();if(sh.start)refreshStart();try{localStorage.setItem('cadforge.workspace',ws)}catch{}});
 CF.on('tool',()=>shellRefresh());
 CF.on('state',({name,value})=>{if(name==='ribbonMin'&&!value)closeMenus();shellRefresh();if(name==='ribbonMin'||name==='clean'||name==='fileTabs')setTimeout(fitRibbon,0)});
 CF.on('command',({def})=>{shellRecent(def?.name);if(sh.start&&!['OPEN','DXFIN'].includes(def?.name))showStart(false);shellRefresh()});
 CF.on('modified',updateTitle);CF.on('document',()=>{updateTitle();if(sh.start)showStart(false)});
 // Engine code changes tool/picking/modified state without events: re-check a cheap signature after each render.
 const shellPrevRender=render;render=function(...a){const r=shellPrevRender(...a);const sig=`${tool}|${CF.picking?.command||''}|${CF.modified}|${CF.fileName}`;if(sig!==sh.sig){sh.sig=sig;shellRefresh();updateTitle()}return r};
 document.addEventListener('pointerdown',e=>{sh.suppress=null;if(!sh.menus.length)return;const t=e.target;if(sh.menus.some(m=>m.el.contains(t)||(m.stay&&m.owner?.contains(t))))return;const own=sh.menus.find(m=>m.owner?.contains(t));closeMenus();if(own)sh.suppress=own.owner},true);
 window.addEventListener('keydown',e=>{if(e.key==='Escape'&&sh.menus.length){closeMenus();e.preventDefault();e.stopPropagation()}},true);
 window.addEventListener('resize',()=>{closeMenus();hideTip();fitRibbon()});
 window.addEventListener('blur',()=>{hideTip()});
 let saved=null;try{saved=localStorage.getItem('cadforge.workspace')}catch{}if(saved==='3d'||saved==='drafting'){if(saved!==CF.workspace)CF.setWorkspace(saved)}
 updateTitle();shellRefresh();
 if(!doc.entities.length&&!doc.solids?.length)showStart(true);
 setTimeout(fitRibbon,0);setTimeout(fitRibbon,400);
}catch(err){console.error('CadForge shell failed to build',err)}
CF.module('shell');
}
