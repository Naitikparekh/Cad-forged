[workspace]
resolver = "2"
members = ["crates/cadforge-core", "crates/cadforge-render", "crates/cadforge-engine", "crates/cadforge-app"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Naitikparekh/Cad-forged"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
# line tables are enough for backtraces; full debug info makes the many test binaries take tens of GB
debug = "line-tables-only"

# Faster-to-build optimized profile for iterating on the web build (`tools/build-web.sh dev`).
[profile.web]
inherits = "release"
opt-level = 1
lto = false
debug = false
