name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-pip libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: ezdxf (the DXF tests check our files against it)
        run: python3 -m pip install ezdxf
      - run: cargo test --workspace
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
      - run: cargo clippy --workspace --all-targets
      - name: Benchmark evidence still points at real code and tests
        run: python3 tools/benchmark/score.py --check

  web:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(cargo metadata --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="wasm-bindgen"))')"
      - run: tools/build-web.sh dev

  package:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build and package
        shell: bash
        run: tools/package.sh
      - name: Check the packages
        shell: bash
        run: tests/package/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cadforge-${{ matrix.os }}
          path: dist/*
